[package]
name = "ectool"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Reusable flashing and UniLog tools for EigenComm cellular chips"
repository = "https://github.com/yuzhan-tech/ectool"
readme = "README.md"
keywords = ["eigencomm", "flash", "embedded", "serial"]
categories = ["command-line-utilities", "embedded", "hardware-support"]

[features]
default = ["cli", "unilog"]
cli = ["dep:clap", "dep:env_logger", "dep:indicatif", "unilog"]
unilog = ["dep:chrono"]

[[bin]]
name = "ectool"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
crc32fast = "1"
env_logger = { version = "0.11", optional = true }
hex = "0.4"
indicatif = { version = "0.17", optional = true }
log = "0.4"
serialport = { version = "4", features = ["usbportinfo-interface"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
